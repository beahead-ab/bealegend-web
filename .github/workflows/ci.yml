name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing, and Actions minutes are metered.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tsc -b runs inside build, so this is the type check as well.
      - run: npm run build
      - run: npm test
